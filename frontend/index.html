<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureBank AI Assistant</title>
  <style>
    :root {
      --primary: #1a237e;
      --secondary: #0d47a1;
      --surface: #ffffff;
      --surface-2: #f4f7ff;
      --border: #d1d9ff;
      --text: #1f2937;
      --muted: #5f6a7d;
      --error: #d32f2f;
      --shadow: 0 18px 40px rgba(9, 22, 87, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0d154d 0%, #1a237e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: min(100%, 980px);
      background: var(--surface);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 80vh;
    }

    .header {
      background: var(--primary);
      color: #ffffff;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 700;
      font-size: 18px;
    }

    .header-text {
      display: grid;
      gap: 6px;
    }

    .header-text h1 {
      font-size: 22px;
      letter-spacing: 0.01em;
    }

    .header-text p {
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
    }

    .chat-window {
      padding: 24px 24px 0;
      background: var(--surface-2);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 80%;
    }

    .message.bot {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 12px;
      background: var(--primary);
      display: grid;
      place-items: center;
      color: white;
      font-size: 18px;
      border: 2px solid rgba(26, 35, 126, 0.28);
    }

    .bubble {
      border-radius: 20px;
      padding: 16px 18px;
      position: relative;
      line-height: 1.6;
      font-size: 15px;
      box-shadow: 0 10px 24px rgba(26, 35, 126, 0.06);
    }

    .bubble.bot {
      background: #ffffff;
      border: 1px solid #e1e5f9;
      color: var(--text);
    }

    .bubble.user {
      background: var(--secondary);
      color: #ffffff;
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #f8faff;
      border: 1px solid #e0e7ff;
      border-radius: 18px;
      color: #475569;
      width: fit-content;
    }

    .typing-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.4;
      animation: bounce 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    .input-area {
      padding: 18px 24px 24px;
      background: #ffffff;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border-top: 1px solid #e7ecff;
    }

    .input-wrapper {
      display: flex;
      background: #f4f7ff;
      border-radius: 999px;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
      border: 1px solid #d6dff6;
    }

    .input-wrapper input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      font-size: 15px;
      min-height: 42px;
    }

    .button,
    .upload-button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .button {
      background: var(--primary);
      color: white;
      min-width: 100px;
    }

    .upload-button {
      background: white;
      color: var(--primary);
      border: 1px solid #c5cee9;
    }

    .button:hover,
    .upload-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(26, 35, 126, 0.14);
    }

    .file-input {
      display: none;
    }

    .welcome {
      margin-bottom: 12px;
      color: #475569;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 720px) {
      body {
        padding: 16px;
      }

      .container {
        min-height: 100vh;
        border-radius: 20px;
      }

      .header {
        padding: 18px 20px;
      }

      .chat-window {
        padding: 18px 18px 0;
      }

      .input-area {
        padding: 16px 18px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">SB</div>
      <div class="header-text">
        <h1>SecureBank AI Assistant</h1>
        <p>Your trusted banking assistant for loans, cards, and policies.</p>
      </div>
    </div>

    <div class="chat-window" id="chatWindow">
      <div class="message bot">
        <div class="avatar">🏦</div>
        <div class="bubble bot" id="welcomeMessage">
          Hello! I am SecureBank AI Assistant. I can help you with loans, credit cards, banking FAQs, and RBI guidelines. How can I help you today?
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" />
        <button class="upload-button" id="uploadButton" type="button">Upload</button>
        <input type="file" id="fileInput" class="file-input" accept=".pdf,.txt" />
      </div>
      <button class="button" id="sendButton" type="button">Send</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://bankingchatbot-production.up.railway.app";
    const session_id = Math.random().toString(36).slice(2);

    const chatWindow = document.getElementById("chatWindow");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const uploadButton = document.getElementById("uploadButton");
    const fileInput = document.getElementById("fileInput");

    function scrollToBottom() {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function createMessageBubble(text, type) {
      const messageEl = document.createElement("div");
      messageEl.className = `message ${type}`;

      if (type === "bot") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🏦";
        messageEl.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = `bubble ${type}`;
      bubble.textContent = text;
      messageEl.appendChild(bubble);

      return messageEl;
    }

    function addMessage(text, type) {
      const messageBubble = createMessageBubble(text, type);
      chatWindow.appendChild(messageBubble);
      scrollToBottom();
    }

    function showTypingIndicator() {
      const typingEl = document.createElement("div");
      typingEl.className = "message bot typing";
      typingEl.id = "typingIndicator";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🏦";
      typingEl.appendChild(avatar);

      const bubble = document.createElement("div");
      bubble.className = "bubble bot typing-indicator";
      bubble.innerHTML = `Typing<span class="typing-dots"><span></span><span></span><span></span></span>`;
      typingEl.appendChild(bubble);

      chatWindow.appendChild(typingEl);
      scrollToBottom();
    }

    function hideTypingIndicator() {
      const typingEl = document.getElementById("typingIndicator");
      if (typingEl) {
        typingEl.remove();
      }
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      const userBubble = createMessageBubble(message, "user");
      chatWindow.appendChild(userBubble);
      messageInput.value = "";
      scrollToBottom();

      showTypingIndicator();

      try {
        const response = await fetch(`${BACKEND_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id }),
        });

        const data = await response.json();
        hideTypingIndicator();

        const reply = response.ok && data.reply ? data.reply : "Sorry, something went wrong. Please try again.";
        const botBubble = createMessageBubble(reply, "bot");
        chatWindow.appendChild(botBubble);
      } catch (error) {
        hideTypingIndicator();
        const botBubble = createMessageBubble("Sorry, something went wrong. Please try again.", "bot");
        chatWindow.appendChild(botBubble);
      }

      scrollToBottom();
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        // Prevent the default Enter key behaviour before sending the message
        event.preventDefault();
        sendMessage();
      }
    });

    uploadButton.addEventListener('click', function(e) {
      e.preventDefault();
      fileInput.click();
    });

    fileInput.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      addMessage('Uploading ' + file.name + ', please wait...', 'bot');
      const formData = new FormData();
      formData.append('file', file);
      try {
        const response = await fetch(BACKEND_URL + '/upload', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (response.ok) {
          addMessage('File uploaded! ' + data.chunks_indexed + ' chunks indexed. Ask me questions about it!', 'bot');
        } else {
          addMessage('Upload failed: ' + data.detail, 'bot');
        }
      } catch (error) {
        addMessage('Upload failed. Please check server is running.', 'bot');
      }
      fileInput.value = '';
    });

    window.addEventListener("load", () => {
      scrollToBottom();
    });
  </script>
</body>
</html>
