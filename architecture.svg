<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Banking Chatbot Architecture Diagram</title>
<desc>Architecture showing frontend, backend, RAG pipeline, vector database, and LLM flow</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Background -->
<rect width="680" height="580" fill="#f8f9ff" rx="16"/>

<!-- User -->
<rect x="40" y="40" width="120" height="56" rx="8" fill="#e8e8e8" stroke="#aaa" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="100" y="62" text-anchor="middle" dominant-baseline="central" fill="#222">User</text>
<text font-family="sans-serif" font-size="12" x="100" y="80" text-anchor="middle" dominant-baseline="central" fill="#555">Browser</text>

<!-- Arrow: User to Frontend -->
<line x1="160" y1="68" x2="218" y2="68" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Frontend -->
<rect x="220" y="40" width="140" height="56" rx="8" fill="#b5d4f4" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="290" y="62" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Frontend</text>
<text font-family="sans-serif" font-size="12" x="290" y="80" text-anchor="middle" dominant-baseline="central" fill="#185FA5">index.html</text>

<!-- Arrow: Frontend to FastAPI -->
<line x1="290" y1="96" x2="290" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- FastAPI Backend -->
<rect x="180" y="150" width="220" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="290" y="172" text-anchor="middle" dominant-baseline="central" fill="#085041">FastAPI Backend</text>
<text font-family="sans-serif" font-size="12" x="290" y="190" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">/chat  /upload  /health</text>

<!-- Arrow: FastAPI to RAG Pipeline -->
<line x1="290" y1="206" x2="290" y2="258" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- RAG Pipeline -->
<rect x="180" y="260" width="220" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="290" y="282" text-anchor="middle" dominant-baseline="central" fill="#3C3489">RAG Pipeline</text>
<text font-family="sans-serif" font-size="12" x="290" y="300" text-anchor="middle" dominant-baseline="central" fill="#534AB7">rag_pipeline.py</text>

<!-- Arrow: RAG to ChromaDB -->
<line x1="220" y1="316" x2="142" y2="378" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Arrow: RAG to Groq LLM -->
<line x1="360" y1="316" x2="458" y2="378" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ChromaDB -->
<rect x="40" y="380" width="200" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="140" y="402" text-anchor="middle" dominant-baseline="central" fill="#633806">ChromaDB</text>
<text font-family="sans-serif" font-size="12" x="140" y="420" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Vector store + search</text>

<!-- Groq LLM -->
<rect x="420" y="380" width="200" height="56" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="520" y="402" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Groq LLM</text>
<text font-family="sans-serif" font-size="12" x="520" y="420" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Llama 3.1 8B Instant</text>

<!-- Arrow: ChromaDB back to RAG -->
<path d="M100 380 L100 340 L218 316" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Arrow: Groq back to RAG -->
<path d="M560 380 L560 340 L362 316" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Banking Documents -->
<rect x="40" y="500" width="200" height="56" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="140" y="522" text-anchor="middle" dominant-baseline="central" fill="#27500A">Banking Documents</text>
<text font-family="sans-serif" font-size="12" x="140" y="540" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">loan, cards, FAQ, RBI</text>

<!-- Arrow: Documents to ChromaDB -->
<line x1="140" y1="500" x2="140" y2="438" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Sentence Transformers -->
<rect x="420" y="500" width="200" height="56" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" x="520" y="522" text-anchor="middle" dominant-baseline="central" fill="#4B1528">Embeddings</text>
<text font-family="sans-serif" font-size="12" x="520" y="540" text-anchor="middle" dominant-baseline="central" fill="#993556">sentence-transformers</text>

<!-- Arrow: Embeddings to ChromaDB -->
<path d="M480 500 L480 460 L242 422" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Railway Cloud box -->
<rect x="420" y="135" width="220" height="36" rx="8" fill="none" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3"/>
<text font-family="sans-serif" font-size="12" x="530" y="157" text-anchor="middle" dominant-baseline="central" fill="#555">☁ Deployed on Railway</text>

</svg>